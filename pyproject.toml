
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pitwall"
version = "0.1.0"
description = "PITWALL race-strategy simulator and decision-support system"
readme = "README.md"
authors = [{ name = "PITWALL Team" }]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=10.0.0",
    "statsmodels>=0.14.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0"
]
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["."]
include = ["pitwall*", "backend*"]
